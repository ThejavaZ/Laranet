name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Laranet!Tests1"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433

      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: laranet
          POSTGRES_DB: laranet_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d laranet_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: laranet
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -plaranet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: laranet
        ports:
          - 3308:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Display .NET version
        run: dotnet --version

      - name: Restore dependencies
        run: dotnet restore Laranet.slnx

      - name: Build solution
        run: dotnet build Laranet.slnx --configuration Release --no-restore

      - name: Run tests (SQLite)
        env:
          LARANET_TEST_PROVIDER: sqlite
        run: dotnet test Laranet.slnx --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Verify project templates
        run: bash .github/scripts/verify-templates.sh

      - name: Verify CRUD profiles
        run: bash .github/scripts/verify-crud-profiles.sh

      - name: Wait for SQL Server
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if docker exec "${{ job.services.sqlserver.id }}" bash -c \
              "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Laranet!Tests1' -C -Q 'SELECT 1' >/dev/null 2>&1 || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Laranet!Tests1' -Q 'SELECT 1' >/dev/null 2>&1"; then
              echo "SQL Server is ready."
              exit 0
            fi

            sleep 2
          done

          echo "SQL Server did not become ready in time." >&2
          exit 1

      - name: Run provider tests (SQL Server)
        env:
          LARANET_TEST_PROVIDER: sqlserver
          LARANET_SQLSERVER_CONNECTION: "Server=localhost,1433;Database=laranet_tests;User Id=sa;Password=Laranet!Tests1;TrustServerCertificate=True;Encrypt=True;Pooling=False"
        run: dotnet test Laranet.slnx --configuration Release --no-build --filter "FullyQualifiedName~ProviderCompatibilityTests" --logger "console;verbosity=normal"

      - name: Run provider tests (PostgreSQL)
        env:
          LARANET_TEST_PROVIDER: postgresql
          LARANET_POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=laranet_tests;Username=postgres;Password=laranet;Pooling=false"
        run: dotnet test Laranet.slnx --configuration Release --no-build --filter "FullyQualifiedName~ProviderCompatibilityTests" --logger "console;verbosity=normal"

      - name: Run provider tests (MySQL)
        env:
          LARANET_TEST_PROVIDER: mysql
          LARANET_MYSQL_CONNECTION: "Server=localhost;Port=3306;User Id=root;Password=laranet;SslMode=Disabled;AllowPublicKeyRetrieval=True;Pooling=False"
        run: dotnet test Laranet.slnx --configuration Release --no-build --filter "FullyQualifiedName~ProviderCompatibilityTests" --logger "console;verbosity=normal"

      - name: Run provider tests (MariaDB)
        env:
          LARANET_TEST_PROVIDER: mariadb
          LARANET_MYSQL_CONNECTION: "Server=localhost;Port=3308;User Id=root;Password=laranet;SslMode=Disabled;AllowPublicKeyRetrieval=True;Pooling=False"
        run: dotnet test Laranet.slnx --configuration Release --no-build --filter "FullyQualifiedName~ProviderCompatibilityTests" --logger "console;verbosity=normal"

      - name: Pack production packages
        run: |
          mkdir -p artifacts/packages
          dotnet pack src/Laranet/Laranet.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/Laranet.Data/Laranet.Data.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/Laranet.EntityFrameworkCore/Laranet.EntityFrameworkCore.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/Laranet.AspNetCore/Laranet.AspNetCore.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/Laranet.Cli/Laranet.Cli.csproj --configuration Release --no-build --output artifacts/packages

      - name: Verify production packages
        shell: bash
        run: bash .github/scripts/verify-packages.sh artifacts/packages
