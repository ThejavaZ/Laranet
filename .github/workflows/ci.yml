name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Display .NET version
        run: dotnet --version

      - name: Restore dependencies
        run: dotnet restore Laranet.slnx

      - name: Build solution
        run: dotnet build Laranet.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Laranet.slnx --configuration Release --no-build --logger "console;verbosity=normal"
